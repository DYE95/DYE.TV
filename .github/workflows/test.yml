name: Ember

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ember-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Node-Toolcache
        id: node-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/node
          key: node-20-${{ runner.os }}-${{ runner.arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Syntax
        run: node --check server.js && find lib public/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Rundenlogik und Duality
        run: node --test test/*.test.js
