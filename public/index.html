<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ember</title>
  <link rel="stylesheet" href="/css/ember.css?v=9" />
  <link rel="stylesheet" href="/css/topbar.css?v=9" />
  <link rel="stylesheet" href="/css/start.css?v=9" />
  <script>
    function emberGo(name) {
      document.querySelectorAll(".view").forEach(function (v) {
        v.classList.toggle("on", v.id === "view-" + name);
      });
    }
    function emberLeave() {
      try { window.close(); } catch (e) {}
      document.body.innerHTML = "<div class='menu'><div class='menu-card'><h1>Ember</h1><p class='hint'>Schwarzes Fenster schließen oder Strg+C.</p></div></div>";
    }
    document.addEventListener("click", function (ev) {
      var btn = ev.target.closest("[data-go]");
      if (btn) emberGo(btn.getAttribute("data-go"));
      if (ev.target.closest("#btnLeave")) emberLeave();
    });
  </script>
</head>
<body>
  <div id="emberError" hidden></div>
  <aside class="hud" id="spotlightHud">
    <div class="hud-title">Want Spotlight</div>
    <div id="hudQueue" class="hud-list"><p class="hint">Noch niemand hebt die Hand.</p></div>
  </aside>
  <div class="app">
    <header class="ember-topbar">
      <div class="brand">Ember · Age of Umbra</div>
      <div class="grow"></div>
      <div class="chip" id="lanChip">LAN …</div>
      <button class="icon-btn" data-go="menu" title="Zurück" aria-label="Zurück">
        <img src="/img/icon-back.svg" alt="" width="18" height="18" />
      </button>
      <a class="icon-btn" href="/" title="Home" aria-label="Home">
        <img src="/img/icon-home.svg" alt="" width="18" height="18" />
      </a>
      <a class="icon-btn" href="/#panelSettings" title="Einstellungen" aria-label="Einstellungen">
        <img src="/img/icon-gear.svg" alt="" width="18" height="18" />
      </a>
    </header>

    <section class="view on" id="view-menu">
      <div class="start">
        <div class="start-side">
          <div class="start-card">
            <div class="sigil"></div>
            <h1 class="start-title">Ember</h1>
            <p class="tagline">Die Glut am Rand der Umbra</p>
            <div class="start-menu">
              <button class="start-item" data-go="session"><b>Entfache die Glut</b><span>Session öffnen, Speak the Dark</span></button>
              <button class="start-item" data-go="encounter"><b>Events</b><span>Karten bereitlegen, dann Play Event</span></button>
              <button class="start-item" data-go="campaign"><b>Kampagne</b><span>was jetzt brennt</span></button>
              <button class="start-item" data-go="campaign-manager"><b>Kampagnen-Manager</b><span>Editor</span></button>
              <button class="start-item" data-go="character"><b>Charakter</b><span>aktiver Bogen</span></button>
              <button class="start-item" data-go="character-manager"><b>Charakter-Manager</b><span>Editor + Fotos</span></button>
              <button class="start-item start-item-danger" id="btnLeave"><b>Verlöschen</b><span>Ember schließen</span></button>
            </div>
          </div>
        </div>
        <div class="start-art" role="img" aria-label="Lagerfeuer am Rand der Umbra"></div>
      </div>
    </section>
MARKER
