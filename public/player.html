<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1b2733" />
  <title>Ember · Spieler</title>
  <link rel="stylesheet" href="/css/ember.css?v=11" />
  <link rel="stylesheet" href="/css/table-indicator.css?v=1" />
</head>
<body class="house-body">
  <div class="player-shell">
    <header class="topbar">
      <a class="btn tiny ghost" href="/">Home</a>
      <div class="brand">Spieler</div>
      <button class="btn tiny" id="btnRoles" type="button">Rollen</button>
      <div class="grow"></div>
      <a class="btn tiny ghost" href="/token">Atelier</a>
      <div class="chip" id="tableNote">—</div>
      <div class="chip" id="turnChip">—</div>
      <div class="chip" id="who">offen</div>
    </header>
    <div class="role-menu hidden" id="roleMenu"></div>
    <div class="scroll" id="gate">
      <div class="menu-card" style="width:min(640px,94%);margin:24px auto;text-align:left;">
        <h1>An den Tisch</h1>
        <p class="hint">Sitz antippen, dann den Charakter. Leer heißt nicht verbunden.</p>
        <div id="tablePlayer" data-table="player"></div>
        <div class="list" id="seatList"></div>
        <button class="btn" id="btnGuest" style="width:100%;margin-top:12px;">Als Gast (Karte + Video)</button>
      </div>
    </div>
    <div class="stage hidden" id="mapStage"></div>
    <div class="play-dock hidden" id="playActions">
      <div class="row">
        <button class="btn tiny" id="btnSheet" type="button">Bogen</button>
        <button class="btn primary" id="btnReady" type="button">Ready</button>
        <button class="btn primary" id="btnSpotlight">Want Spotlight</button>
      </div>
      <label>Frage <input id="question" placeholder="Darf ich …" /></label>
      <div class="row">
        <label>Hope <input id="hopeDie" type="number" min="1" max="12" inputmode="numeric" /></label>
        <label>Fear <input id="fearDie" type="number" min="1" max="12" inputmode="numeric" /></label>
        <button class="btn" id="btnTableRoll">Echte Würfel</button>
        <label>Trait
          <select id="traitPick">
            <option value="agility">Agility</option>
            <option value="strength">Strength</option>
            <option value="finesse">Finesse</option>
            <option value="instinct">Instinct</option>
            <option value="presence">Presence</option>
            <option value="knowledge">Knowledge</option>
          </select>
        </label>
        <button class="btn primary" id="btnRoll">Würfeln</button>
      </div>
      <p class="hint" id="rollOut"></p>
      <button class="btn" id="btnPing">Ping</button>
    </div>
    <div class="scroll hidden" id="sheet"></div>
    <div class="scroll hidden" id="playLog"></div>
    <div class="row" id="logFilter" style="padding:0 12px;">
      <input id="playLogQ" placeholder="Log filtern" />
      <select id="playLogKind">
        <option value="">Alles</option>
        <option value="roll">Würfe</option>
        <option value="note">Notizen</option>
      </select>
    </div>
    <div class="scroll hidden" id="handouts"></div>
    <div class="home-media hidden" id="playVideoBox" style="padding:8px 12px;">
      <video id="playVideo" controls playsinline style="width:100%;max-height:240px;background:#0b1016;"></video>
      <div class="list" id="playClips"></div>
    </div>
  </div>
  <script src="/js/table-indicator.js?v=1"></script>
  <script src="/js/video-deck.js?v=5"></script>
  <script src="/js/map.js?v=6"></script>
  <style>
    .player-shell { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    .player-shell.seated { display: grid; grid-template-rows: auto minmax(180px, 1fr) auto auto; }
    #mapStage { min-height: 0; }
    #sheet { max-height: 28dvh; overflow: auto; }
    .play-dock { padding: 8px 12px 12px; background: #121820; border-top: 1px solid #334556; }
    .role-menu { position: absolute; top: 52px; right: 12px; z-index: 8; width: min(280px, 92vw); background: #121820; border: 1px solid #334556; padding: 8px; }
    .role-menu .card { width: 100%; text-align: left; margin-top: 6px; }
  </style>
  <script src="/js/player.js?v=15"></script>
</body>
</html>
